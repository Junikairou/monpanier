name: Déployer sur GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx expo export -p web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID }}
      # Contrôle lisible dans le journal : la connexion Google sans redirection
      # n'est active que si l'identifiant client a bien été embarqué au build.
      - name: Vérifier la connexion Google
        run: |
          if grep -rqs "apps.googleusercontent.com" dist/_expo; then
            echo "Connexion Google : identifiant client embarqué, bouton Google sans redirection ACTIF."
          else
            echo "Connexion Google : identifiant client ABSENT du build — l'app garde l'ancien bouton par redirection (secret EXPO_PUBLIC_GOOGLE_CLIENT_ID non défini ?)."
          fi
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
